name: Fitness bot

concurrency:
  group: repo-writes
  cancel-in-progress: false
  # queue: max — без этого GitHub может отменить накопившиеся прогоны
  # в очереди вместо последовательного выполнения (найдено в
  # metals-news-bot 21.07.2026, тот же паттерн защиты здесь заранее,
  # не после того как столкнёмся с той же проблемой).
  queue: max

on:
  # 28.07.2026: КРИТИЧНЫЙ ФИКС — раньше здесь был cron, потом
  # workflow_dispatch с bot.py, читающим getUpdates. Оказалось:
  # getUpdates и активный webhook ВЗАИМОИСКЛЮЧАЮЩИ (Telegram API отдаёт
  # апдейты либо туда, либо туда, не в оба места сразу) — с активным
  # webhook getUpdates просто не видел новых сообщений, tg_offset не
  # двигался, бот молчал. Первое реальное сообщение Антона ("упражнения
  # на бицепс", 13:31 МСК) прошло цепочку Worker->GitHub Actions
  # успешно, но bot.py внутри не получил апдейт.
  #
  # Исправлено: Worker теперь шлёт repository_dispatch с самим телом
  # Telegram update в client_payload — bot.py читает апдейт ОТТУДА
  # (переменная TELEGRAM_UPDATE_JSON), не через повторный getUpdates.
  repository_dispatch:
    types: [telegram_update]
  workflow_dispatch: {}  # для ручной проверки/отладки без реального апдейта

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
        run: python bot.py

      - name: Commit workouts + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workouts.json state_bot.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "bot: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 retries"; exit 1
