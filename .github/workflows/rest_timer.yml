name: Rest timer

concurrency:
  group: repo-writes
  cancel-in-progress: false
  queue: max

on:
  # cron_ping приходит от Cloudflare Worker'а по ЕГО СОБСТВЕННОМУ Cron
  # Trigger (каждую минуту — Cloudflare не поддерживает чаще, см.
  # cloudflare-worker/DEPLOY.md), не напрямую от Telegram. Worker не
  # знает содержимого тренировки — просто "будит" этот workflow каждую
  # минуту, вся логика (истёк ли реально таймер отдыха) — в timer.py.
  repository_dispatch:
    types: [cron_ping]
  workflow_dispatch: {}  # для ручной проверки

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check rest timer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python timer.py

      - name: Commit workouts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workouts.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "timer: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 retries"; exit 1
